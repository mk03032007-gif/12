<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Spider</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-obj-model-component/dist/aframe-obj-model-component.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin:0; overflow:hidden;">

<a-scene
 embedded
 vr-mode-ui="enabled:false"
 renderer="logarithmicDepthBuffer:true;"
 arjs="sourceType:webcam; debugUIEnabled:false;">

```
<a-assets>

    <a-asset-item
        id="spider-obj"
        src="./Only_Spider_with_Animations_Export.obj">
    </a-asset-item>

</a-assets>

<a-marker preset="hiro">

    <a-light
        type="ambient"
        intensity="5">
    </a-light>

    <a-light
        type="directional"
        position="2 4 2"
        intensity="5">
    </a-light>

    <a-entity
        obj-model="obj:#spider-obj"
        material="color:#cccccc"
        position="0 0.2 0"
        rotation="-90 0 0"
        scale="0.0005 0.0005 0.0005">
    </a-entity>

</a-marker>

<a-entity camera></a-entity>
```

</a-scene>

</body>
</html>
